name: Run FanCode Scraper

on:
  schedule:
    - cron: '*/5 * * * *' # প্রতি ৫ মিনিট পর পর রান করার জন্য
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Run Scraper Script
        run: python main.py # আপনার পাইথন ফাইলের নাম যদি অন্য কিছু হয় তবে তা এখানে দিয়ে দেবেন

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add playlist.m3u links.json Index.html status.txt Row_Link/
          git commit -m "Auto-update FanCode playlist and links.json [skip ci]" || exit 0
          git push
